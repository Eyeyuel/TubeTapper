worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Rate limiting zone: max 100 requests per second per IP
    limit_req_zone $binary_remote_addr zone=telegram_limit:10m rate=100r/s;

    upstream tubetapper_bot_cluster {
        server bot:8000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # Maximum payload for incoming webhook updates
        client_max_body_size 20M;

        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Telegram webhook endpoint
        location / {
            limit_req zone=telegram_limit burst=50 nodelay;

            proxy_pass http://tubetapper_bot_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Buffering optimizations for webhooks
            proxy_buffering off;
            proxy_read_timeout 90s;
        }
    }
}
