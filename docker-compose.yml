services:
  redis:
    image: redis:7-alpine
    container_name: tubetapper_redis
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --tcp-backlog 511
      --timeout 300
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Local C++ Telegram Bot API Server (Unlocks 2GB uploads and LAN zero-copy transfer)
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    container_name: tubetapper_bot_api
    profiles:
      - local-api
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID:-}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH:-}
      - TELEGRAM_LOCAL=1
      - TELEGRAM_STAT=1
    volumes:
      - downloads_data:/app/downloads
      - telegram_bot_api_data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"

  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tubetapper_bot
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DOWNLOAD_DIR=/app/downloads
      - TELEGRAM_API_SERVER_URL=${TELEGRAM_API_SERVER_URL:-}
    volumes:
      - .:/app
      - downloads_data:/app/downloads
      # Optional: mount cookies.txt if available locally for YouTube bot bypass
      # - ./cookies.txt:/app/cookies.txt:ro
    ports:
      - "8000:8000"
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # Scalable distributed download worker cluster (Run: docker compose up -d --scale worker=5)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: python -m arq worker.WorkerSettings
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DOWNLOAD_DIR=/app/downloads
      - TELEGRAM_API_SERVER_URL=${TELEGRAM_API_SERVER_URL:-}
    volumes:
      - .:/app
      - downloads_data:/app/downloads
      # Optional: mount cookies.txt if available locally for YouTube bot bypass
      # - ./cookies.txt:/app/cookies.txt:ro
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  # High-performance Nginx Reverse Proxy for Webhook mode
  nginx:
    image: nginx:alpine
    container_name: tubetapper_nginx
    profiles:
      - production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - bot
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:latest
    container_name: tubetapper_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: tubetapper_grafana
    ports:
      - "3000:3000"
    profiles:
      - monitoring

volumes:
  redis_data:
    driver: local
  downloads_data:
    driver: local
  telegram_bot_api_data:
    driver: local
